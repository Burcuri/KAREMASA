<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kare Masa — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;}

.wallpaper{
  position:fixed;inset:0;
  background:url('images/wallpaper.svg') center/cover no-repeat;
  z-index:0;
}
.wallpaper::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#0f0f1a 100%);
  z-index:-1;
}
.wallpaper::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,0.45);
}

.center{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;text-align:center;padding:20px;
}

.logo-box{width:110px;height:110px;position:relative;}
.logo-box img{width:100%;height:100%;object-fit:contain;}
.logo-fallback{
  width:110px;height:110px;background:#9e3a1a;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bangers',cursive;font-size:13px;
  letter-spacing:1px;color:rgba(255,255,255,0.5);
}

.title{
  font-family:'Bangers',cursive;
  font-size:clamp(52px,10vw,100px);
  letter-spacing:6px;color:#FAFAF5;line-height:0.88;
  text-shadow:5px 5px 0 #9e3a1a,9px 9px 0 rgba(0,0,0,0.4);
}
.title span{color:#F2C744;}

.slogan{
  font-family:'Bangers',cursive;
  font-size:clamp(14px,2.5vw,22px);
  letter-spacing:5px;color:#267a65;
  text-shadow:0 0 20px rgba(38,122,101,0.6);
  transform:rotate(-1.5deg);
}

.divider{
  width:120px;height:3px;
  background:repeating-linear-gradient(90deg,
    #9e3a1a 0,#9e3a1a 20px,#267a65 20px,#267a65 40px,
    #4a2f4a 40px,#4a2f4a 60px,#8a6e1a 60px,#8a6e1a 80px);
  opacity:0.7;
}

.btn-signup{
  background:transparent;color:#FAFAF5;
  border:3px solid rgba(255,255,255,0.5);
  font-family:'Bangers',cursive;
  font-size:22px;letter-spacing:6px;
  padding:16px 52px;cursor:pointer;
  clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
  transition:all 0.3s;
}
.btn-signup:hover{
  background:#9e3a1a;border-color:#9e3a1a;
  letter-spacing:8px;
  box-shadow:0 0 30px rgba(158,58,26,0.4);
}

.footnote{
  font-family:'Bangers',cursive;font-size:13px;
  letter-spacing:3px;color:rgba(255,255,255,0.25);margin-top:-10px;
}

.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#1a1a2e;border:3px solid #9e3a1a;
  max-width:420px;width:100%;
  animation:popIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:none;}}
.modal-header{
  background:#9e3a1a;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Bangers',cursive;font-size:24px;letter-spacing:3px;color:white;}
.modal-close{background:none;border:none;color:white;font-size:24px;cursor:pointer;transition:transform 0.2s;}
.modal-close:hover{transform:scale(1.2);}
.modal-body{padding:28px 24px;}
.modal-desc{font-family:'Nunito',sans-serif;font-size:14px;color:rgba(255,255,255,0.65);line-height:1.7;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Bangers',cursive;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.15);
  color:white;font-size:15px;font-family:'Nunito',sans-serif;outline:none;
  transition:border-color 0.2s;
}
.field input:focus{border-color:#9e3a1a;}
.submit-btn{
  width:100%;padding:14px;background:#9e3a1a;color:white;border:none;
  font-family:'Bangers',cursive;font-size:20px;letter-spacing:3px;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:background 0.2s;margin-bottom:10px;
}
.submit-btn:hover{background:#267a65;}
.msg{font-size:13px;text-align:center;padding:10px;display:none;}
.msg.ok{background:rgba(38,122,101,0.2);color:#3dbfa0;border:1px solid #267a65;}
.msg.err{background:rgba(158,58,26,0.2);color:#e8562a;border:1px solid #9e3a1a;}

@media(max-width:480px){
  .title{letter-spacing:3px;}
  .btn-signup{font-size:18px;padding:14px 36px;}
}
</style>
</head>
<body>

<div class="wallpaper"></div>

<div class="center">
  <div class="logo-box">
    <img src="images/logo.svg" alt="Kare Masa"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="logo-fallback" style="display:none">LOGO</div>
  </div>

  <div class="title">KARE<br><span>MASA</span></div>
  <div class="slogan">✦ Comic Universe Coming Soon ✦</div>
  <div class="divider"></div>

  <button class="btn-signup" onclick="openModal()">SIGN UP</button>
  <div class="footnote">Early members get exclusive first access</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">EARLY ACCESS</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc">
        Drop your email to be the first to know when Karemasa launches and get early access to exclusive content.
      </p>
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="emailInput" placeholder="example@email.com">
      </div>
      <button class="submit-btn" onclick="handleSignup()">JOIN THE LIST</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb = supabase.createClient(
  'https://rgwaaaplwattoepttkjt.supabase.co',
  'sb_publishable_ULsfYUzk5oZVuuIbl7i6sQ_vPudk6RI'
);

function openModal() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

async function handleSignup() {
  var email = document.getElementById('emailInput').value.trim();
  if (!email || email.indexOf('@') < 0) {
    showMsg('Please enter a valid email address.', 'err');
    return;
  }
  var result = await sb.from('waitlist').insert({ email: email });
  if (result.error) {
    if (result.error.code === '23505') {
      showMsg('You are already on the list!', 'ok');
    } else {
      showMsg('Error: ' + result.error.message, 'err');
    }
  } else {
    showMsg('You are on the list! We will reach out when we launch.', 'ok');
    document.getElementById('emailInput').value = '';
  }
}
</script>
</body>
</html>
