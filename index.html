<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kare Masa — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f1a;}

.wallpaper{
  position:fixed;inset:0;
  background:url('wallpaper.svg') center/cover no-repeat;
  z-index:0;
}
.wallpaper::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#0f0f1a 100%);
  z-index:-1;
}
.wallpaper::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,0.45);
}

.center{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;text-align:center;padding:20px;
}

/* karemasa.com — logonun üstünde, küçük, mor, eğimli */
.site-label{
  font-family:'Nunito',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:5px;
  color:#c87fff;
  text-shadow:0 0 16px rgba(200,127,255,0.5);
  transform:rotate(-3deg);
  margin-bottom:-8px;
}

/* Logo — dev */
.logo-box{
  width:220px;height:220px;
  position:relative;
}
.logo-box img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}
.logo-fallback{
  width:220px;height:220px;background:#9e3a1a;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bangers',cursive;font-size:13px;
  letter-spacing:1px;color:rgba(255,255,255,0.5);
}

.slogan{
  font-family:'Bangers',cursive;
  font-size:clamp(14px,2.5vw,22px);
  letter-spacing:5px;color:#267a65;
  text-shadow:0 0 20px rgba(38,122,101,0.6);
  transform:rotate(-1.5deg);
}

.divider{
  width:120px;height:3px;
  background:repeating-linear-gradient(90deg,
    #9e3a1a 0,#9e3a1a 20px,#267a65 20px,#267a65 40px,
    #4a2f4a 40px,#4a2f4a 60px,#8a6e1a 60px,#8a6e1a 80px);
  opacity:0.7;
}

.btn-signup{
  background:transparent;color:#FAFAF5;
  border:3px solid rgba(255,255,255,0.5);
  font-family:'Bangers',cursive;
  font-size:22px;letter-spacing:6px;
  padding:16px 52px;cursor:pointer;
  clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);
  transition:all 0.3s;
}
.btn-signup:hover{
  background:#9e3a1a;border-color:#9e3a1a;
  letter-spacing:8px;
  box-shadow:0 0 30px rgba(158,58,26,0.4);
}

.footnote{
  font-family:'Bangers',cursive;font-size:13px;
  letter-spacing:3px;color:rgba(255,255,255,0.25);margin-top:-10px;
}

.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#1a1a2e;border:3px solid #9e3a1a;
  max-width:420px;width:100%;
  animation:popIn 0.35s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:none;}}
.modal-header{
  background:#9e3a1a;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Bangers',cursive;font-size:24px;letter-spacing:3px;color:white;}
.modal-close{background:none;border:none;color:white;font-size:24px;cursor:pointer;transition:transform 0.2s;}
.modal-close:hover{transform:scale(1.2);}
.modal-body{padding:28px 24px;}
.modal-desc{font-family:'Nunito',sans-serif;font-size:14px;color:rgba(255,255,255,0.65);line-height:1.7;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Bangers',cursive;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.15);
  color:white;font-size:15px;font-family:'Nunito',sans-serif;outline:none;
  transition:border-color 0.2s;
}
.field input:focus{border-color:#9e3a1a;}
.submit-btn{
  width:100%;padding:14px;background:#9e3a1a;color:white;border:none;
  font-family:'Bangers',cursive;font-size:20px;letter-spacing:3px;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:background 0.2s;margin-bottom:10px;
}
.submit-btn:hover{background:#267a65;}
.msg{font-size:13px;text-align:center;padding:10px;display:none;}
.msg.ok{background:rgba(38,122,101,0.2);color:#3dbfa0;border:1px solid #267a65;}
.msg.err{background:rgba(158,58,26,0.2);color:#e8562a;border:1px solid #9e3a1a;}

@media(max-width:480px){
  .logo-box,.logo-fallback{width:160px;height:160px;}
  .btn-signup{font-size:18px;padding:14px 36px;}
}
</style>
</head>
<body>

<canvas id="bg-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>

<div class="wallpaper"></div>

<div class="center">

  <!-- karemasa.com — logonun üstünde -->
  <div class="site-label">www.karemasa.com</div>

  <!-- Logo — büyük -->
  <div class="logo-box">
    <img src="logo.svg" alt="Kare Masa"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="logo-fallback" style="display:none">LOGO</div>
  </div>

  <div class="slogan">✦ Comic Universe Coming Soon ✦</div>
  <div class="divider"></div>

  <button class="btn-signup" onclick="openModal()">SIGN UP</button>
  <div class="footnote">Early members get exclusive first access</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">EARLY ACCESS</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc">
        Drop your email to be the first to know when Karemasa launches and get early access to exclusive content.
      </p>
      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="emailInput" placeholder="example@email.com">
      </div>
      <button class="submit-btn" onclick="handleSignup()">JOIN THE LIST</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb = supabase.createClient(
  'https://rgwaaaplwattoepttkjt.supabase.co',
  'sb_publishable_ULsfYUzk5oZVuuIbl7i6sQ_vPudk6RI'
);
function openModal(){document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
function showMsg(text,type){var el=document.getElementById('msg');el.textContent=text;el.className='msg '+type;el.style.display='block';}
async function handleSignup(){
  var email=document.getElementById('emailInput').value.trim();
  if(!email||email.indexOf('@')<0){showMsg('Please enter a valid email address.','err');return;}
  var result=await sb.from('waitlist').insert({email:email});
  if(result.error){
    if(result.error.code==='23505'){showMsg('You are already on the list!','ok');}
    else{showMsg('Error: '+result.error.message,'err');}
  }else{
    showMsg('You are on the list! We will reach out when we launch.','ok');
    document.getElementById('emailInput').value='';
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ── THREE.JS ARKA PLAN ── */
var c3 = document.getElementById('bg-canvas');
var r3 = new THREE.WebGLRenderer({canvas:c3,antialias:true,alpha:true});
r3.setPixelRatio(Math.min(devicePixelRatio,2));
r3.setSize(innerWidth,innerHeight);

var sc = new THREE.Scene();
var cam = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
cam.position.z = 12;

var COLS = [
  new THREE.Color('#7a2e16'),new THREE.Color('#1e6e58'),
  new THREE.Color('#3e2840'),new THREE.Color('#7a6222'),
  new THREE.Color('#7a4830'),new THREE.Color('#2a7060')
];

/* Partiküller */
var PC = 1600;
var pPos = new Float32Array(PC*3);
var pCol = new Float32Array(PC*3);
var pVel = new Float32Array(PC*3);
var pOrg = new Float32Array(PC*3);
for(var i=0;i<PC;i++){
  var x=(Math.random()-.5)*38, y=(Math.random()-.5)*28, z=(Math.random()-.5)*18;
  pPos[i*3]=pOrg[i*3]=x; pPos[i*3+1]=pOrg[i*3+1]=y; pPos[i*3+2]=pOrg[i*3+2]=z;
  var col=COLS[Math.floor(Math.random()*COLS.length)];
  pCol[i*3]=col.r; pCol[i*3+1]=col.g; pCol[i*3+2]=col.b;
}
var pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
var pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.10,vertexColors:true,transparent:true,opacity:0.7}));
sc.add(pts);

/* Hexagonlar */
var hg=new THREE.Group(); sc.add(hg);
var hCols=[0x7a2e16,0x1e6e58,0x3e2840,0x7a6222,0x7a4830,0x2a7060];
for(var j=0;j<16;j++){
  var wf=j%3===0, sz=0.4+Math.random()*0.8;
  var m=new THREE.Mesh(
    new THREE.CylinderGeometry(sz,sz,0.12,6),
    new THREE.MeshBasicMaterial({color:hCols[j%hCols.length],wireframe:wf,transparent:true,opacity:wf?0.5:0.18})
  );
  var px,py;
  do{px=(Math.random()-.5)*22;py=(Math.random()-.5)*14;}
  while(Math.abs(px)<4&&Math.abs(py)<4);
  m.position.set(px,py,(Math.random()-.5)*8-2);
  m.rotation.x=Math.PI/2;
  m.userData={rz:(Math.random()-.5)*0.015,oy:py,ff:0.3+Math.random()*0.7,fa:0.008+Math.random()*0.012,ph:Math.random()*Math.PI*2};
  hg.add(m);
}

/* Cursor halkaları */
var mkRing=function(r,col){
  var pts2=[];
  for(var i=0;i<=48;i++){var a=i/48*Math.PI*2;pts2.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  var geo=new THREE.BufferGeometry().setFromPoints(pts2);
  var mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0});
  var l=new THREE.LineLoop(geo,mat); l.position.z=8; sc.add(l); return l;
};
var ring1=mkRing(1.2,0x1e6e58);
var ring2=mkRing(1.9,0x7a2e16);

var mx=0,my=0,cx3=0,cy3=0,onPage=false,tt=0,rOp=0,nhTimer=null;

/* Tıklama — hex'e çarptı mı bul */
function screenToWorld(ex,ey){
  var h=Math.tan(Math.PI/6)*12;
  return {x:(ex/innerWidth-.5)*2*h*cam.aspect, y:-(ey/innerHeight-.5)*2*h};
}

var clickTimer=null;
document.addEventListener('click',function(e){
  if(e.target.closest('.center,.modal-overlay')) return;
  var w=screenToWorld(e.clientX,e.clientY);

  /* Tek tık — yakın hex'i döndür + partikülleri spiral at */
  hg.children.forEach(function(h){
    var dx=h.position.x-w.x, dy=h.position.y-w.y;
    if(Math.sqrt(dx*dx+dy*dy)<2.5){
      h.userData.spin=(h.userData.spin||0)+Math.PI*2;
    }
  });
  /* Partiküller spiral */
  for(var i=0;i<PC;i++){
    var ix=i*3,iy=ix+1;
    var dx2=pOrg[ix]-w.x, dy2=pOrg[iy]-w.y;
    var d=Math.sqrt(dx2*dx2+dy2*dy2);
    if(d<5){
      var angle=Math.atan2(dy2,dx2)+Math.PI/2;
      var f=(5-d)/5*0.4;
      pVel[ix]+=Math.cos(angle)*f;
      pVel[iy]+=Math.sin(angle)*f;
    }
  }
});

document.addEventListener('dblclick',function(e){
  if(e.target.closest('.center,.modal-overlay')) return;
  var w=screenToWorld(e.clientX,e.clientY);

  /* Çift tık — yakın hex'i patlat (hızla dışa fırlat) */
  hg.children.forEach(function(h){
    var dx=h.position.x-w.x, dy=h.position.y-w.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<3){
      var angle=Math.atan2(dy,dx);
      h.userData.vx=(h.userData.vx||0)+Math.cos(angle)*3*(1-d/3);
      h.userData.vy=(h.userData.vy||0)+Math.sin(angle)*3*(1-d/3);
      h.userData.explode=1;
    }
  });
  /* Partiküller patlama */
  for(var i=0;i<PC;i++){
    var ix=i*3,iy=ix+1;
    var dx2=pOrg[ix]-w.x, dy2=pOrg[iy]-w.y;
    var d2=Math.sqrt(dx2*dx2+dy2*dy2);
    if(d2<4){
      var f=(4-d2)/4*0.8;
      pVel[ix]+=(dx2/d2)*f;
      pVel[iy]+=(dy2/d2)*f;
    }
  }
});

document.addEventListener('mousemove',function(e){
  mx=(e.clientX/innerWidth-.5)*2;
  my=(e.clientY/innerHeight-.5)*2;
  var h=Math.tan(Math.PI/6)*12;
  cx3=mx*h*cam.aspect; cy3=-my*h;
  onPage=true;
  clearTimeout(nhTimer);
  nhTimer=setTimeout(function(){onPage=false;},3000);
});

(function loop(){
  requestAnimationFrame(loop);
  tt+=0.01;

  cam.position.x+=(mx*1.8-cam.position.x)*0.035;
  cam.position.y+=(-my*1.2-cam.position.y)*0.035;

  var pa=pGeo.attributes.position.array;
  for(var i=0;i<PC;i++){
    var ix=i*3,iy=ix+1,iz=ix+2;
    var dx=pa[ix]-cx3, dy=pa[iy]-cy3, d=Math.sqrt(dx*dx+dy*dy);
    if(onPage&&d<3.5){var f=(3.5-d)/3.5*0.12;pVel[ix]+=(dx/d)*f;pVel[iy]+=(dy/d)*f;}
    pVel[ix]+=(pOrg[ix]-pa[ix])*0.03; pVel[iy]+=(pOrg[iy]-pa[iy])*0.03; pVel[iz]+=(pOrg[iz]-pa[iz])*0.01;
    pVel[ix]*=0.88;pVel[iy]*=0.88;pVel[iz]*=0.88;
    pa[ix]+=pVel[ix];pa[iy]+=pVel[iy];pa[iz]+=pVel[iz];
  }
  pGeo.attributes.position.needsUpdate=true;
  pts.rotation.y=tt*0.03; pts.rotation.x=tt*0.008;

  hg.children.forEach(function(h){
    h.rotation.z+=h.userData.rz;
    /* Spin (tek tık) */
    if(h.userData.spin>0){
      var spd=Math.min(h.userData.spin,0.18);
      h.rotation.z+=spd;
      h.userData.spin=Math.max(0,h.userData.spin-0.18);
    }
    /* Explode (çift tık) */
    if(h.userData.explode){
      h.position.x+=(h.userData.vx||0);
      h.position.y+=(h.userData.vy||0);
      h.userData.vx*=0.92; h.userData.vy*=0.92;
      /* Orijine dön */
      h.position.x+=(h.userData.ox-h.position.x)*0.04;
      h.position.y+=(h.userData.oy-h.position.y)*0.04;
      if(Math.abs(h.userData.vx)<0.01&&Math.abs(h.userData.vy)<0.01) h.userData.explode=0;
    } else {
      h.position.y=h.userData.oy+Math.sin(tt*h.userData.ff*5+h.userData.ph)*h.userData.fa*8;
    }
    /* Orijin kaydet */
    if(h.userData.ox===undefined){h.userData.ox=h.position.x;}
    var dx2=h.position.x-cx3, dy2=h.position.y-cy3, d2=Math.sqrt(dx2*dx2+dy2*dy2);
    var ts=onPage&&d2<4?1+(4-d2)/4*0.6:1;
    h.scale.x+=(ts-h.scale.x)*0.08; h.scale.y+=(ts-h.scale.y)*0.08; h.scale.z+=(ts-h.scale.z)*0.08;
  });

  ring1.position.x+=(cx3-ring1.position.x)*0.12; ring1.position.y+=(cy3-ring1.position.y)*0.12;
  ring2.position.x+=(cx3-ring2.position.x)*0.07; ring2.position.y+=(cy3-ring2.position.y)*0.07;
  rOp+=((onPage?1:0)-rOp)*0.08;
  ring1.material.opacity=rOp*0.55; ring2.material.opacity=rOp*0.30;
  var p=1+Math.sin(tt*4)*0.06;
  ring1.scale.set(p,p,1); ring2.scale.set(1/p,1/p,1);

  r3.render(sc,cam);
})();

window.addEventListener('resize',function(){
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  r3.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
